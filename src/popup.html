<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Blocker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 500px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #764ba2;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
      background: white;
    }

    .section {
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #667eea;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
    }

    .section-title span {
      margin-right: 8px;
      font-size: 16px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .blocked-list {
      list-style: none;
    }

    .blocked-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #667eea;
    }

    .blocked-item-url {
      font-size: 13px;
      color: #333;
      word-break: break-all;
      flex: 1;
    }

    .remove-btn {
      padding: 6px 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-left: 10px;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #ff5252;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }

    .empty-state-icon {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .status-message {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 15px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚫 Page Blocker</h1>
    <p>Block websites and manage your blocked list</p>
  </div>

  <div class="content">
    <!-- Add URL Section -->
    <div class="section">
      <div class="section-title">
        <span>➕</span>
        Add Website to Block
      </div>
      <div id="statusMessage" class="status-message"></div>
      <div class="input-group">
        <input 
          type="text" 
          id="urlInput" 
          placeholder="Enter URL (e.g., example.com or https://example.com)"
        >
        <button id="addBtn">Add</button>
      </div>
    </div>

    <!-- Blocked URLs Section -->
    <div class="section">
      <div class="section-title">
        <span>🔒</span>
        Blocked Websites (<span id="count">0</span>)
      </div>
      <div id="blockedContainer">
        <div class="empty-state">
          <div class="empty-state-icon">🌐</div>
          <p>No websites blocked yet.<br>Add one to get started!</p>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

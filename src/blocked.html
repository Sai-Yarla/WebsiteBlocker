<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Blocked</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    
    .container {
      text-align: center;
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
    }
    
    .sad-face {
      font-size: 120px;
      animation: bounce 2s infinite;
      margin-bottom: 20px;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-direction: column;
    }
    
    button {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    #tempAccessBtn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px 32px;
      font-size: 18px;
    }
    
    #tempAccessBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    #tempAccessBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #goBackBtn {
      background: #f0f0f0;
      color: #333;
    }
    
    #goBackBtn:hover {
      background: #e0e0e0;
    }
    
    .countdown {
      display: none;
      font-size: 18px;
      color: #667eea;
      font-weight: bold;
      margin-top: 20px;
    }
    
    .countdown.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sad-face">😢</div>
    <h1>Website Blocked</h1>
    <p>This website has been blocked to help you stay focused and productive!</p>
    
    <div class="button-group">
      <button id="tempAccessBtn" onclick="requestTemporaryAccess()">
        Temporary Access (60s)
      </button>
      <button id="goBackBtn" onclick="window.history.back()">
        Go Back
      </button>
    </div>
    
    <div class="countdown" id="countdown">
      Access expires in: <span id="countdownTimer">60</span>s
    </div>
  </div>

  <script>
    const TEMP_ACCESS_DURATION = 60 * 1000; // 60 seconds in milliseconds
    
    // Get the domain from URL parameter
    function getBlockedDomain() {
      const params = new URLSearchParams(window.location.search);
      const blockedUrl = params.get('blocked');
      if (blockedUrl) {
        try {
          return new URL(blockedUrl).hostname.replace(/^www\./, '');
        } catch {
          console.error('Could not parse blocked URL');
          return null;
        }
      }
      return null;
    }
    
    // Request temporary access
    function requestTemporaryAccess() {
      console.log('=== Temporary Access Button Clicked ===');
      
      const domain = getBlockedDomain();
      if (!domain) {
        console.error('Could not determine blocked domain');
        alert('Error: Could not determine blocked domain');
        return;
      }
      
      console.log('Domain:', domain);
      
      // Get current temporary access data
      chrome.storage.local.get(['tempAccess'], (result) => {
        console.log('Current tempAccess data:', result.tempAccess);
        
        const tempAccess = result.tempAccess || {};
        
        // Set new access expiration time
        const expiresAt = Date.now() + TEMP_ACCESS_DURATION;
        tempAccess[domain] = expiresAt;
        
        console.log('Setting access expiration:', new Date(expiresAt));
        
        // Save to chrome storage
        chrome.storage.local.set({ tempAccess }, () => {
          console.log('Successfully saved to chrome.storage.local');
          
          // Show countdown
          showCountdown();
          
          // Redirect to original URL
          const blockedUrl = new URLSearchParams(window.location.search).get('blocked');
          console.log('Will redirect to:', blockedUrl);
          
          setTimeout(() => {
            console.log('Redirecting now...');
            window.location.href = blockedUrl;
          }, 500);
        });
      });
    }
    
    // Show countdown timer
    function showCountdown() {
      const countdownDiv = document.getElementById('countdown');
      const countdownTimer = document.getElementById('countdownTimer');
      const tempAccessBtn = document.getElementById('tempAccessBtn');
      
      console.log('Showing countdown...');
      
      countdownDiv.classList.add('show');
      tempAccessBtn.disabled = true;
      
      let secondsLeft = 60;
      countdownTimer.textContent = secondsLeft;
      
      const interval = setInterval(() => {
        secondsLeft--;
        countdownTimer.textContent = secondsLeft;
        
        if (secondsLeft <= 0) {
          clearInterval(interval);
          countdownDiv.classList.remove('show');
          tempAccessBtn.disabled = false;
        }
      }, 1000);
    }
  </script>
</body>
</html>
